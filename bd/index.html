<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1030" />
<title>Bubble Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
/* one scrollbar style everywhere */

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-track{background:#0b1230;border-left:1px solid rgba(214,171,96,.18)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#f0cf87,#c99a4e 55%,#9c7230);border:2px solid #0b1230;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffe0a0,#e3ad55)}
::-webkit-scrollbar-corner{background:#0b1230}

</style></head>

<div id="root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
